name: Build DoorX iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Detect and Normalize Project Root
        run: |
          echo "Checking directory structure..."
          ls -la
          if [ ! -f "package.json" ]; then
            echo "package.json not in root, searching in subdirectories..."
            PKG_PATH=$(find . -maxdepth 3 -name "package.json" -not -path "*/node_modules/*" | head -n 1)
            if [ -n "$PKG_PATH" ]; then
              DIR=$(dirname "$PKG_PATH")
              echo "Found package.json in: $DIR. Moving files to root..."
              shopt -s dotglob nullglob
              mv "$DIR"/* .
            else
              echo "ERROR: package.json could not be found anywhere in this repository!"
              exit 1
            fi
          fi

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: |
          npm install --legacy-peer-deps
          npm install --legacy-peer-deps @capacitor/core @capacitor/cli @capacitor/ios

      - name: Build Web App
        run: npm run build

      - name: Add & Sync iOS Platform
        run: |
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi
          npx cap sync ios
          cd ios/App
          pod install --repo-update

      - name: Configure App Transport Security (Allow HTTP to 192.168.4.1)
        run: |
          PLIST_PATH="ios/App/App/Info.plist"
          if [ -f "$PLIST_PATH" ]; then
            /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" "$PLIST_PATH" || true
            /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsArbitraryLoads bool true" "$PLIST_PATH" || true
            /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsLocalNetworking bool true" "$PLIST_PATH" || true
          fi

      - name: Build iOS App Binary (Unsigned)
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

          mkdir -p build/ipa/Payload
          cp -r build/Build/Products/Release-iphoneos/App.app build/ipa/Payload/DoorX.app
          cd build/ipa
          zip -r -q DoorX.ipa Payload

      - name: Upload IPA to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DoorX-iOS-Release-IPA
          path: ios/App/build/ipa/DoorX.ipa
          retention-days: 14
