name: Build DoorX iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/ios

      - name: Build Web App
        run: npm run build

      - name: Add & Sync iOS Platform
        run: |
          npx cap add ios || true
          npx cap sync ios

      - name: Configure App Transport Security (Allow HTTP to 192.168.4.1)
        run: |
          PLIST_PATH="ios/App/App/Info.plist"
          if [ -f "$PLIST_PATH" ]; then
            /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" "$PLIST_PATH" || true
            /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsArbitraryLoads bool true" "$PLIST_PATH" || true
            /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsLocalNetworking bool true" "$PLIST_PATH" || true
          fi

      - name: Build iOS Archive & IPA
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/DoorX.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            archive

          mkdir -p build/ipa/Payload
          cp -r build/DoorX.xcarchive/Products/Applications/App.app build/ipa/Payload/DoorX.app
          cd build/ipa
          zip -r DoorX.ipa Payload

      - name: Upload IPA to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DoorX-iOS-Release-IPA
          path: ios/App/build/ipa/DoorX.ipa
          retention-days: 14
